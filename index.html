<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Jugendwort der Woche</title>
<meta name="theme-color" content="#f4ea3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jugendwort">

<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>

<style>
  :root{
    --ink:#191b1f;
    --ink-soft:#5b6068;
    --ink-faint:#9aa0a8;
    --paper:#ffffff;
    --field:#f4f5f2;
    --line:#e6e7e3;
    --marker:#f4ea3c;
    --marker-soft:#faf6c8;
    --on-marker:#191b1f;      /* Schrift auf gelbem Marker: IMMER dunkel */
    --danger:#c9463d;
    --radius:14px;
  }
  html[data-theme="dark"]{
    --ink:#eceef1;
    --ink-soft:#a7acb4;
    --ink-faint:#71767e;
    --paper:#212327;
    --field:#161719;
    --line:#33363b;
    --marker:#f4ea3c;
    --marker-soft:#3a3712;
    --on-marker:#191b1f;
    --danger:#e06c63;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--field);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
    transition:background .2s, color .2s;
  }
  .wrap{max-width:640px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 20px 80px}
  header.app{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:10px}
  .brand{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;user-select:none}
  .brand em{font-style:normal;background:var(--marker);color:var(--on-marker);padding:1px 5px 2px;border-radius:4px}
  .hright{display:flex;align-items:center;gap:12px}
  .who{font-size:13px;color:var(--ink-soft);cursor:pointer}
  .who:hover{color:var(--ink)}
  .gear{background:none;font-size:17px;color:var(--ink-soft);padding:4px 6px;border-radius:8px;line-height:1}
  .gear:hover{color:var(--ink);background:var(--paper)}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:6px}
  h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:14px}
  p.sub{font-size:14px;color:var(--ink-soft);margin-bottom:18px}

  input[type=text]{
    width:100%;font:inherit;font-size:15px;padding:12px 14px;
    border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);
    transition:border-color .15s;
  }
  input[type=text]:focus{outline:none;border-color:var(--ink)}
  input[type=text]::placeholder{color:var(--ink-faint)}

  button{font:inherit;cursor:pointer;border:none;border-radius:10px;transition:transform .06s, background .15s, border-color .15s;color:inherit}
  button:active{transform:scale(.98)}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn{background:var(--ink);color:var(--field);font-size:15px;font-weight:600;padding:12px 18px;width:100%}
  .btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--ink)}
  .btn.small{width:auto;font-size:13px;padding:8px 13px}
  .btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--line)}
  .btn.danger:hover{border-color:var(--danger)}
  .row{display:flex;gap:10px}
  .row > *{flex:1}

  .glist{display:flex;flex-direction:column;gap:10px}
  .gitem{
    display:flex;justify-content:space-between;align-items:center;
    padding:15px 16px;background:var(--paper);border:1px solid var(--line);
    border-radius:var(--radius);cursor:pointer;transition:border-color .15s;
  }
  .gitem:hover{border-color:var(--ink)}
  .gitem .gname{font-weight:700;font-size:15px}
  .gitem .gcode{font-size:12px;color:var(--ink-faint);letter-spacing:.12em;font-variant-numeric:tabular-nums}
  .gitem .arrow{color:var(--ink-faint);font-size:18px}

  .hero{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:34px 22px 26px;text-align:center;margin-bottom:16px;overflow:hidden;
  }
  .hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:16px}
  .hero .word{
    display:inline-block;
    font-size:clamp(34px,9vw,52px);font-weight:850;letter-spacing:-.02em;line-height:1.15;
    position:relative;padding:.04em .2em .06em;transform:rotate(-1.2deg);
    word-break:break-word;cursor:pointer;
    color:var(--on-marker);   /* Schrift liegt auf dem Marker: immer dunkel, in beiden Themes */
  }
  .hero .word::before{
    content:"";position:absolute;inset:2% -2% 0% -2%;
    background:var(--marker);z-index:-1;transform:skew(-6deg) rotate(.6deg);
    border-radius:5px;
  }
  .hero .word.reveal{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
  @keyframes pop{
    0%{opacity:0;transform:rotate(-1.2deg) scale(.4)}
    100%{opacity:1;transform:rotate(-1.2deg) scale(1)}
  }
  .hero .meta{font-size:13px;color:var(--ink-soft);margin-top:16px}
  .hero .empty-word{font-size:17px;color:var(--ink-soft);padding:6px 0 2px}
  .hero .count{font-size:13px;color:var(--ink-faint);margin-top:14px;font-variant-numeric:tabular-nums}

  .wlist{display:flex;flex-direction:column}
  .witem{
    display:flex;align-items:center;gap:12px;padding:13px 2px;
    border-bottom:1px solid var(--line);
  }
  .witem:last-child{border-bottom:none}
  .witem .wtext{flex:1;min-width:0}
  .witem .wtext .w{font-weight:650;font-size:15px;word-break:break-word}
  .witem .wtext .by{font-size:12px;color:var(--ink-faint);margin-top:1px}
  .witem.drawn .w{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-faint)}
  .tag{
    font-size:11px;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-radius:999px;
    background:var(--marker-soft);white-space:nowrap;
  }
  .tag.role{background:var(--ink);color:var(--field)}
  .tag.superu{background:var(--marker);color:var(--on-marker)}
  .icon-btn{
    background:transparent;color:var(--ink-faint);font-size:14px;padding:6px 8px;border-radius:8px;
  }
  .icon-btn:hover{background:var(--field);color:var(--ink)}
  .icon-btn.del:hover{color:var(--danger)}

  .mitem{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
  .mitem:last-child{border-bottom:none}
  .mitem .mname{flex:1;font-weight:600;font-size:14.5px}
  .mitem .mname span{color:var(--ink-faint);font-weight:400}

  .share-code{
    font-size:30px;font-weight:800;letter-spacing:.28em;text-align:center;
    padding:14px 0 14px .28em;background:var(--field);border-radius:10px;margin-bottom:12px;
    font-variant-numeric:tabular-nums;user-select:all;
  }
  #qr{display:flex;justify-content:center;padding:8px 0 4px}
  #qr img, #qr canvas{border-radius:8px;background:#fff;padding:8px}

  .note{font-size:12.5px;color:var(--ink-faint);margin-top:10px;line-height:1.5}
  .backlink{display:inline-block;font-size:13.5px;color:var(--ink-soft);cursor:pointer;margin-bottom:16px;background:none;padding:0}
  .backlink:hover{color:var(--ink)}
  .msg{font-size:13.5px;color:var(--danger);margin-top:8px;min-height:1em}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--ink);color:var(--field);font-size:13.5px;font-weight:600;
    padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:50;white-space:nowrap;
  }
  .toast.show{opacity:1}

  .overlay{
    position:fixed;inset:0;background:rgba(10,11,13,.55);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:40;
  }
  .overlay.show{display:flex}
  .modal{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;width:100%;max-width:420px}
  .modal h3{font-size:17px;font-weight:800;margin-bottom:14px}
  .modal .row{margin-top:14px}
  .setrow{margin-bottom:16px}
  .setrow label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .seg{display:flex;gap:8px}
  .seg button{
    flex:1;font-size:14px;font-weight:600;padding:10px 8px;
    background:transparent;border:1.5px solid var(--line);border-radius:10px;color:var(--ink-soft);
  }
  .seg button.on{background:var(--ink);border-color:var(--ink);color:var(--field)}

  .hidden{display:none !important}
  .spin{
    width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--ink);
    border-radius:50%;margin:40px auto;animation:sp .8s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .setup-warn{
    background:#fff6f5;border:1px solid #f0cfcc;border-radius:var(--radius);
    padding:18px;font-size:14px;line-height:1.6;color:#7a2e28;
  }
  .setup-warn code{background:#fff;padding:1px 5px;border-radius:5px;font-size:13px}
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <div class="brand" onclick="goHome()">Jugendwort <em>der Woche</em></div>
    <div class="hright">
      <div class="who" id="whoami" onclick="editName()"></div>
      <button class="gear" onclick="showModal('modal-settings')" title="Einstellungen" id="gear-btn">&#9881;</button>
    </div>
  </header>

  <div id="loading"><div class="spin"></div></div>

  <!-- SETUP-HINWEIS falls Firebase-Konfiguration fehlt -->
  <section id="view-setup" class="hidden">
    <div class="setup-warn">
      <strong>Firebase ist noch nicht konfiguriert.</strong><br>
      Öffne <code>index.html</code> und ersetze den Block <code>firebaseConfig</code> ganz oben im
      <code>&lt;script&gt;</code>-Teil durch die Konfiguration deines Firebase-Projekts.
      Die Schritt-für-Schritt-Anleitung steht in der <code>ANLEITUNG.md</code>.
    </div>
  </section>

  <!-- ONBOARDING -->
  <section id="view-onboard" class="hidden">
    <div class="card">
      <h1 data-i18n="obTitle"></h1>
      <p class="sub" data-i18n="obSub"></p>
      <input type="text" id="ob-name" data-i18n-ph="obPh" maxlength="30">
      <div class="msg" id="ob-msg"></div>
      <button class="btn" style="margin-top:6px" onclick="saveName()" data-i18n="obBtn"></button>
    </div>
  </section>

  <!-- HOME -->
  <section id="view-home" class="hidden">
    <div class="card">
      <h2 data-i18n="homeGroups"></h2>
      <div class="glist" id="home-groups"></div>
      <p class="sub" id="home-empty" style="margin:4px 0 0" data-i18n="homeEmpty"></p>
    </div>
    <div class="row">
      <button class="btn" onclick="showModal('modal-create')" data-i18n="createGroupBtn"></button>
      <button class="btn ghost" onclick="showModal('modal-join')" data-i18n="joinBtn"></button>
    </div>
  </section>

  <!-- GROUP -->
  <section id="view-group" class="hidden">
    <button class="backlink" onclick="goHome()" id="back-btn"></button>

    <div class="hero" id="hero"></div>

    <div class="card">
      <h2 data-i18n="submitTitle"></h2>
      <div class="row">
        <input type="text" id="new-word" data-i18n-ph="wordPh" maxlength="60" onkeydown="if(event.key==='Enter')submitWord()">
        <button class="btn small" style="flex:0 0 auto" onclick="submitWord()" data-i18n="submitBtn"></button>
      </div>
      <div class="msg" id="word-msg"></div>
    </div>

    <div class="card">
      <h2 id="wlist-title"></h2>
      <div class="wlist" id="wlist"></div>
      <p class="sub" id="wlist-empty" style="margin:2px 0 0" data-i18n="wlistEmpty"></p>
    </div>

    <div class="card">
      <h2 data-i18n="historyTitle"></h2>
      <div class="wlist" id="history"></div>
      <p class="sub" id="history-empty" style="margin:2px 0 0" data-i18n="historyEmpty"></p>
    </div>

    <div class="card">
      <h2 data-i18n="membersTitle"></h2>
      <div id="mlist"></div>
      <p class="note" id="mlist-note"></p>
    </div>

    <div class="card">
      <h2 data-i18n="inviteTitle"></h2>
      <div class="share-code" id="share-code"></div>
      <div id="qr"></div>
      <div class="row" style="margin-top:12px">
        <button class="btn ghost" onclick="copyCode()" data-i18n="copyCode"></button>
        <button class="btn ghost" onclick="copyLink()" data-i18n="copyLink"></button>
      </div>
      <p class="note" data-i18n="inviteNote"></p>
    </div>

    <div class="card hidden" id="danger-card">
      <h2 data-i18n="dangerTitle"></h2>
      <p class="sub" style="margin-bottom:12px" data-i18n="dangerSub"></p>
      <button class="btn danger" onclick="deleteGroup()" data-i18n="dangerBtn"></button>
    </div>

    <p class="note" style="text-align:center" data-i18n="footNote"></p>
  </section>
</div>

<!-- MODALS -->
<div class="overlay" id="modal-create" onclick="if(event.target===this)hideModals()">
  <div class="modal">
    <h3 data-i18n="createTitle"></h3>
    <input type="text" id="create-name" data-i18n-ph="groupNamePh" maxlength="40">
    <div class="msg" id="create-msg"></div>
    <div class="row">
      <button class="btn ghost" onclick="hideModals()" data-i18n="cancel"></button>
      <button class="btn" onclick="createGroup()" data-i18n="createBtn"></button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-join" onclick="if(event.target===this)hideModals()">
  <div class="modal">
    <h3 data-i18n="joinTitle"></h3>
    <input type="text" id="join-code" data-i18n-ph="codePh" maxlength="6" style="text-transform:uppercase;letter-spacing:.2em;font-weight:700">
    <div class="msg" id="join-msg"></div>
    <div class="row">
      <button class="btn ghost" onclick="hideModals()" data-i18n="cancel"></button>
      <button class="btn" onclick="joinGroup()" data-i18n="joinConfirm"></button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-edit" onclick="if(event.target===this)hideModals()">
  <div class="modal">
    <h3 data-i18n="editTitle"></h3>
    <input type="text" id="edit-word" maxlength="60">
    <div class="msg" id="edit-msg"></div>
    <div class="row">
      <button class="btn ghost" onclick="hideModals()" data-i18n="cancel"></button>
      <button class="btn" onclick="saveEdit()" data-i18n="save"></button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-settings" onclick="if(event.target===this)hideModals()">
  <div class="modal">
    <h3 data-i18n="settingsTitle"></h3>
    <div class="setrow">
      <label data-i18n="langLabel"></label>
      <div class="seg" id="seg-lang">
        <button onclick="setLang('de')" data-val="de">Deutsch</button>
        <button onclick="setLang('en')" data-val="en">English</button>
      </div>
    </div>
    <div class="setrow">
      <label data-i18n="themeLabel"></label>
      <div class="seg" id="seg-theme">
        <button onclick="setTheme('auto')" data-val="auto" data-i18n="themeAuto"></button>
        <button onclick="setTheme('light')" data-val="light" data-i18n="themeLight"></button>
        <button onclick="setTheme('dark')" data-val="dark" data-i18n="themeDark"></button>
      </div>
    </div>
    <button class="btn ghost" onclick="hideModals()" data-i18n="close"></button>
  </div>
</div>

<div class="toast" id="toast"></div>

function t(key){ return STR[prefs.lang][key]; }

/* ---------- state ---------- */
let db = null;
let me = null;                 // {userId, name, groups:[{code,name}], seen:{code:key}}
let prefs = { lang: 'de', theme: 'auto' };
let group = null;
let groupRef = null;
let editingWordId = null;
let drawWatch = null;

const $ = id => document.getElementById(id);
const KEY_ME = 'jw_me';
const KEY_PREFS = 'jw_prefs';
const gPath = code => 'groups/' + code;

/* ---------- lokale Daten ---------- */
function loadMe(){
  try{ const v = localStorage.getItem(KEY_ME); return v ? JSON.parse(v) : null; }catch(e){ return null; }
}
function saveMe(){
  try{ localStorage.setItem(KEY_ME, JSON.stringify(me)); }catch(e){}
}
function loadPrefs(){
  try{
    const v = localStorage.getItem(KEY_PREFS);
    if(v){ prefs = Object.assign(prefs, JSON.parse(v)); return; }
  }catch(e){}
  /* Erststart: Browsersprache übernehmen */
  prefs.lang = (navigator.language||'de').toLowerCase().startsWith('de') ? 'de' : 'en';
}
function savePrefs(){
  try{ localStorage.setItem(KEY_PREFS, JSON.stringify(prefs)); }catch(e){}
}

/* ---------- Sprache & Theme anwenden ---------- */
function setLang(lang){
  prefs.lang = lang; savePrefs();
  applyI18n();
  if(group) renderGroup();
}
function setTheme(theme){
  prefs.theme = theme; savePrefs();
  applyTheme();
  markSegs();
}
function resolvedTheme(){
  if(prefs.theme !== 'auto') return prefs.theme;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(){
  document.documentElement.setAttribute('data-theme', resolvedTheme());
}
if(window.matchMedia){
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{
    if(prefs.theme==='auto') applyTheme();
  });
}
function applyI18n(){
  document.documentElement.lang = prefs.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.getAttribute('data-i18n')); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder = t(el.getAttribute('data-i18n-ph')); });
  $('back-btn').textContent = t('back');
  $('gear-btn').title = t('gearT');
  markSegs();
}
function markSegs(){
  document.querySelectorAll('#seg-lang button').forEach(b=>b.classList.toggle('on', b.dataset.val===prefs.lang));
  document.querySelectorAll('#seg-theme button').forEach(b=>b.classList.toggle('on', b.dataset.val===prefs.theme));
}

/* ---------- Objekt<->Array-Helfer ---------- */
const wordsArr  = g => Object.values(g && g.words  || {});
const drawsArr  = g => Object.values(g && g.draws  || {});
const membersArr= g => Object.entries(g && g.members|| {}).map(([uid,m])=>({userId:uid, ...m}));

/* ---------- deterministische Auslosung ---------- */
function xmur3(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h<<13)|(h>>>19);
  }
  return ()=>{ h = Math.imul(h ^ (h>>>16), 2246822507); h = Math.imul(h ^ (h>>>13), 3266489909); return (h ^= h>>>16)>>>0; };
}
function mulberry32(a){
  return ()=>{ a|=0; a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; };
}
function lastDrawDue(now){
  const d = new Date(now);
  const day = (d.getDay()+6)%7;
  d.setHours(10,0,0,0);
  d.setDate(d.getDate()-day);
  if(d > now) d.setDate(d.getDate()-7);
  return d;
}
function nextDrawDate(now){
  const d = lastDrawDue(now); d.setDate(d.getDate()+7); return d;
}
function periodId(date){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,'0'), dd=String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
async function runDueDraw(g){
  const pid = periodId(lastDrawDue(new Date()));
  if(g.createdAt && g.createdAt > lastDrawDue(new Date()).getTime()) return false;
  if(drawsArr(g).some(x=>x.periodId===pid)) return false;
  const active = wordsArr(g).filter(w=>!w.drawn).sort((a,b)=>a.id.localeCompare(b.id));
  if(active.length===0) return false;
  const rnd = mulberry32(xmur3(g.code + '|' + pid)());
  const pick = active[Math.floor(rnd()*active.length)];
  const did = 'd_' + pid;
  const upd = {};
  upd[`words/${pick.id}/drawn`] = pid;
  upd[`draws/${did}`] = {periodId: pid, wordId: pick.id, text: pick.text, by: pick.userName, at: Date.now()};
  await db.ref(gPath(g.code)).update(upd);
  return true;
}

/* ---------- init ---------- */
window.addEventListener('load', init);
function firebaseReady(){ return firebaseConfig.apiKey !== 'HIER_EINTRAGEN'; }
function init(){
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  loadPrefs();
  applyTheme();
  applyI18n();
  $('loading').classList.add('hidden');
  if(!firebaseReady()){ show('view-setup'); return; }
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  me = loadMe();
  if(!me || !me.name){ show('view-onboard'); $('ob-name').focus(); return; }
  renderWho();
  goHome();
  const hashCode = readJoinHash();
  if(hashCode) prefillJoin(hashCode);
}
function readJoinHash(){
  try{
    const m = (location.hash||'').match(/join=([A-Z0-9]{6})/i);
    return m ? m[1].toUpperCase() : null;
  }catch(e){ return null; }
}
function prefillJoin(code){
  $('join-code').value = code;
  setTimeout(()=>{ showModal('modal-join'); }, 100);
}

/* ---------- onboarding / name ---------- */
function saveName(){
  const name = $('ob-name').value.trim();
  if(!name){ $('ob-msg').textContent = t('errNoName'); return; }
  if(!me) me = { userId: 'u_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36), name:'', groups:[], seen:{} };
  me.name = name;
  saveMe();
  renderWho();
  goHome();
  const hashCode = readJoinHash();
  if(hashCode) prefillJoin(hashCode);
}
function editName(){
  if(!me) return;
  detachGroup();
  show('view-onboard');
  $('ob-name').value = me.name || '';
  $('ob-name').focus();
}
function renderWho(){ $('whoami').textContent = me && me.name ? me.name : ''; }

/* ---------- navigation ---------- */
function show(id){
  ['view-setup','view-onboard','view-home','view-group'].forEach(v=>$(v).classList.add('hidden'));
  $(id).classList.remove('hidden');
}
function goHome(){
  detachGroup();
  renderHome();
  show('view-home');
}
function detachGroup(){
  if(groupRef){ groupRef.off(); groupRef = null; }
  if(drawWatch){ clearInterval(drawWatch); drawWatch = null; }
  group = null;
}

/* ---------- home ---------- */
function renderHome(){
  const list = $('home-groups');
  list.innerHTML = '';
  const gs = (me && me.groups) || [];
  $('home-empty').style.display = gs.length ? 'none' : 'block';
  gs.forEach(g=>{
    const el = document.createElement('div');
    el.className = 'gitem';
    el.onclick = ()=>openGroup(g.code);
    el.innerHTML = `<div><div class="gname"></div><div class="gcode">${g.code}</div></div><div class="arrow">&rarr;</div>`;
    el.querySelector('.gname').textContent = g.name;
    list.appendChild(el);
  });
}

/* ---------- create / join ---------- */
function genCode(){
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
  return c;
}
async function createGroup(){
  const name = $('create-name').value.trim();
  if(!name){ $('create-msg').textContent=t('errGroupName'); return; }
  $('create-msg').textContent='';
  try{
    let code, exists, tries=0;
    do{
      code = genCode();
      exists = (await db.ref(gPath(code)).get()).exists();
      tries++;
    }while(exists && tries<5);
    const g = {
      code, name,
      ownerId: me.userId, ownerName: me.name,
      createdAt: Date.now(),
      members: { [me.userId]: {name: me.name, super: true} }
    };
    await db.ref(gPath(code)).set(g);
    me.groups.push({code, name});
    saveMe();
    hideModals();
    $('create-name').value='';
    openGroup(code);
  }catch(e){
    $('create-msg').textContent=t('createFailed');
  }
}
async function joinGroup(){
  const code = $('join-code').value.trim().toUpperCase();
  if(code.length!==6){ $('join-msg').textContent=t('errCodeLen'); return; }
  $('join-msg').textContent='';
  try{
    const snap = await db.ref(gPath(code)).get();
    if(!snap.exists()){ $('join-msg').textContent=t('errNotFound'); return; }
    const g = snap.val();
    if(!me.groups.some(x=>x.code===code)){
      me.groups.push({code, name: g.name});
      saveMe();
    }
    hideModals();
    $('join-code').value='';
    openGroup(code);
  }catch(e){
    $('join-msg').textContent=t('errConn');
  }
}

/* ---------- group view (Live-Sync) ---------- */
function openGroup(code){
  detachGroup();
  show('view-group');
  $('hero').innerHTML = '<div class="spin"></div>';
  groupRef = db.ref(gPath(code));
  groupRef.on('value', async snap => {
    if(!snap.exists()){
      toast(t('groupGone'));
      me.groups = me.groups.filter(x=>x.code!==code);
      saveMe();
      goHome(); return;
    }
    group = snap.val();
    group.code = code;
    await ensureMember(code);
    renderGroup();
  }, () => {
    toast(t('connLost'));
  });
  drawWatch = setInterval(async ()=>{
    if(group){ try{ await runDueDraw(group); }catch(e){} }
  }, 10000);
  setTimeout(async ()=>{ if(group){ try{ await runDueDraw(group); }catch(e){} } }, 1500);
}
async function ensureMember(code){
  if(!group.members) group.members = {};
  if(!group.members[me.userId]){
    group.members[me.userId] = {name: me.name, super: false};
    await db.ref(gPath(code) + '/members/' + me.userId).set({name: me.name, super: false});
  }
}

function isAdmin(){ return group && me && group.ownerId === me.userId; }
function isSuper(){
  if(!group || !me) return false;
  if(group.ownerId === me.userId) return true;
  const m = group.members && group.members[me.userId];
  return !!(m && m.super);
}

function renderGroup(){
  if(!group) return;
  /* hero */
  const draws0 = drawsArr(group).sort((a,b)=>(b.at||0)-(a.at||0) || b.periodId.localeCompare(a.periodId));
  const current = draws0[0];
  const nowPid = periodId(lastDrawDue(new Date()));
  const activeN = wordsArr(group).filter(w=>!w.drawn).length;
  const hero = $('hero');
  let heroHtml = `<div class="eyebrow">${esc(group.name)} &middot; ${t('eyebrow')}</div>`;
  const seenKey = current ? current.periodId + ':' + (current.at||0) : null;
  const unseen = current && current.periodId === nowPid && getSeen(group.code) !== seenKey;
  if(current && current.periodId === nowPid){
    heroHtml += `<div class="word${unseen?' reveal':''}" onclick="celebrate()" title="${t('replay')}">${esc(current.text)}</div>
      <div class="meta">${t('submittedBy')} ${esc(current.by)} &middot; ${t('weekFrom')} ${fmtDate(current.periodId)}</div>`;
  }else{
    heroHtml += `<div class="empty-word">${activeN ? t('notDrawn') : t('noWords')}</div>`;
  }
  heroHtml += `<div class="count" id="countdown"></div>`;
  if(isSuper() && activeN > 0){
    heroHtml += `<div style="margin-top:16px"><button class="btn small ghost" onclick="manualDraw()">${t('drawNow')}</button></div>`;
  }
  hero.innerHTML = heroHtml;
  tickCountdown();
  if(unseen){
    setTimeout(celebrate, 350);
    setSeen(group.code, seenKey);
  }

  /* word list */
  const list = $('wlist'); list.innerHTML='';
  const words = wordsArr(group).sort((a,b)=> (a.drawn?1:0)-(b.drawn?1:0) || b.createdAt-a.createdAt);
  $('wlist-empty').style.display = words.length ? 'none':'block';
  $('wlist-title').textContent = t('wlistTitle')(activeN);
  words.forEach(w=>{
    const el = document.createElement('div');
    el.className = 'witem' + (w.drawn ? ' drawn':'');
    const canEdit = isSuper() || w.userId === me.userId;
    el.innerHTML = `
      <div class="wtext">
        <div class="w"></div>
        <div class="by"></div>
      </div>
      ${w.drawn ? '<span class="tag">'+t('drawnTag')+'</span>' : ''}
      ${canEdit && !w.drawn ? '<button class="icon-btn" title="'+t('editT')+'">&#9998;</button>' : ''}
      ${canEdit ? '<button class="icon-btn del" title="'+t('delT')+'">&#10005;</button>' : ''}
    `;
    el.querySelector('.w').textContent = w.text;
    el.querySelector('.by').textContent = t('by') + ' ' + w.userName + (w.drawn ? ' \u00b7 ' + t('weekFrom') + ' ' + fmtDate(w.drawn) : '');
    el.querySelectorAll('.icon-btn').forEach(b=>{
      if(b.classList.contains('del')) b.onclick = ()=>deleteWord(w.id);
      else b.onclick = ()=>openEdit(w.id);
    });
    list.appendChild(el);
  });

  /* history */
  const hist = $('history'); hist.innerHTML='';
  $('history-empty').style.display = draws0.length ? 'none':'block';
  draws0.forEach(d=>{
    const el = document.createElement('div');
    el.className='witem';
    el.innerHTML = `<div class="wtext"><div class="w"></div><div class="by"></div></div>`;
    el.querySelector('.w').textContent = d.text;
    el.querySelector('.by').textContent = t('weekFrom') + ' ' + fmtDate(d.periodId) + ' \u00b7 ' + t('by') + ' ' + d.by;
    hist.appendChild(el);
  });

  /* Mitglieder & Rollen */
  const ml = $('mlist'); ml.innerHTML='';
  membersArr(group).forEach(m=>{
    const el = document.createElement('div');
    el.className = 'mitem';
    const isOwner = m.userId === group.ownerId;
    const roleTag = isOwner ? '<span class="tag role">'+t('admin')+'</span>'
                  : (m.super ? '<span class="tag superu">'+t('superu')+'</span>' : '');
    const canToggle = isAdmin() && !isOwner;
    el.innerHTML = `
      <div class="mname"></div>
      ${roleTag}
      ${canToggle ? `<button class="btn small ghost">${m.super ? t('revokeSuper') : t('makeSuper')}</button>` : ''}
    `;
    el.querySelector('.mname').innerHTML = esc(m.name) + (m.userId===me.userId ? ' <span>'+t('you')+'</span>' : '');
    if(canToggle) el.querySelector('button').onclick = ()=>toggleSuper(m.userId, !m.super);
    ml.appendChild(el);
  });
  $('mlist-note').textContent = isAdmin() ? t('noteAdmin') : (isSuper() ? t('noteSuper') : t('noteMember'));

  /* share */
  $('share-code').textContent = group.code;
  renderQR();
  $('danger-card').classList.toggle('hidden', !isAdmin());
}

let cdTimer=null;
function tickCountdown(){
  if(cdTimer) clearInterval(cdTimer);
  const upd = ()=>{
    const n = $('countdown'); if(!n){ clearInterval(cdTimer); return; }
    const diff = nextDrawDate(new Date()) - new Date();
    const d = Math.floor(diff/86400000), h = Math.floor(diff%86400000/3600000), m = Math.floor(diff%3600000/60000);
    n.textContent = t('countdown')(d,h,m);
  };
  upd();
  cdTimer = setInterval(upd, 30000);
}

/* ---------- Auslosungen ---------- */
async function manualDraw(){
  if(!isSuper()){ toast(t('onlySuperDraw')); return; }
  const pid = periodId(lastDrawDue(new Date()));
  const already = drawsArr(group).some(d=>d.periodId===pid);
  if(already && !confirm(t('alreadyDrawn'))) return;
  const active = wordsArr(group).filter(w=>!w.drawn);
  if(active.length===0){ toast(t('emptyPot')); return; }
  const pick = active[Math.floor(Math.random()*active.length)];
  const at = Date.now();
  const did = 'd_' + pid + '_' + at;
  const upd = {};
  upd[`words/${pick.id}/drawn`] = pid;
  upd[`draws/${did}`] = {periodId: pid, wordId: pick.id, text: pick.text, by: pick.userName, at};
  try{ await db.ref(gPath(group.code)).update(upd); }
  catch(e){ toast(t('drawFailed')); }
}

/* ---------- words ---------- */
async function submitWord(){
  const inp = $('new-word');
  const text = inp.value.trim();
  if(!text){ $('word-msg').textContent=t('errEmptyWord'); return; }
  if(wordsArr(group).some(w=>w.text.toLowerCase()===text.toLowerCase())){
    $('word-msg').textContent=t('errDup'); return;
  }
  $('word-msg').textContent='';
  const id = 'w_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const w = { id, text, userId: me.userId, userName: me.name, createdAt: Date.now(), drawn: null };
  try{
    await db.ref(gPath(group.code) + '/words/' + id).set(w);
    inp.value='';
    toast(t('wordSubmitted'));
  }catch(e){
    $('word-msg').textContent=t('saveFailed');
  }
}
async function deleteWord(id){
  const w = group.words && group.words[id];
  if(!w) return;
  if(!confirm(t('confirmDelWord')(w.text))) return;
  try{
    await db.ref(gPath(group.code) + '/words/' + id).remove();
    toast(t('deleted'));
  }catch(e){ toast(t('delFailed')); }
}
function openEdit(id){
  editingWordId = id;
  const w = group.words && group.words[id];
  if(!w) return;
  $('edit-word').value = w.text;
  $('edit-msg').textContent='';
  showModal('modal-edit');
}
async function saveEdit(){
  const text = $('edit-word').value.trim();
  if(!text){ $('edit-msg').textContent=t('errEmptyEdit'); return; }
  try{
    await db.ref(gPath(group.code) + '/words/' + editingWordId + '/text').set(text);
    hideModals();
    toast(t('saved'));
  }catch(e){ $('edit-msg').textContent=t('saveFailed'); }
}

/* ---------- Rollen ---------- */
async function toggleSuper(userId, makeSuper){
  try{
    await db.ref(gPath(group.code) + '/members/' + userId + '/super').set(makeSuper);
    toast(makeSuper ? t('superGranted') : t('superRevoked'));
  }catch(e){ toast(t('changeFailed')); }
}

/* Gruppe endgültig löschen – nur Admin, mit doppelter Bestätigung */
async function deleteGroup(){
  if(!isAdmin()){ toast(t('onlyAdminDelete')); return; }
  const code = group.code, name = group.name;
  if(!confirm(t('confirmDelGroup')(name))) return;
  const typed = prompt(t('promptCode')(code));
  if((typed||'').trim().toUpperCase() !== code){ toast(t('codeWrong')); return; }
  try{
    detachGroup();
    await db.ref(gPath(code)).remove();
    me.groups = me.groups.filter(x=>x.code!==code);
    saveMe();
    goHome();
    toast(t('groupDeleted'));
  }catch(e){
    toast(t('deleteFailed'));
    openGroup(code);
  }
}

/* ---------- Konfetti & Seen-Tracking ---------- */
function getSeen(code){ return (me.seen||{})[code] || null; }
function setSeen(code, key){
  if(!me.seen) me.seen = {};
  me.seen[code] = key;
  saveMe();
}
function celebrate(){
  if(typeof confetti !== 'function') return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const dark = resolvedTheme()==='dark';
  const colors = dark
    ? ['#f4ea3c','#f2b63c','#ffffff','#eceef1']
    : ['#f4ea3c','#f2b63c','#191b1f','#ffffff'];
  confetti({particleCount:90, spread:75, origin:{y:.35}, colors, scalar:1.05});
  setTimeout(()=>confetti({particleCount:50, angle:60, spread:60, origin:{x:0, y:.5}, colors}), 180);
  setTimeout(()=>confetti({particleCount:50, angle:120, spread:60, origin:{x:1, y:.5}, colors}), 320);
}

/* ---------- share ---------- */
function joinLink(){
  try{ return location.href.split('#')[0] + '#join=' + group.code; }
  catch(e){ return group.code; }
}
function renderQR(){
  const box = $('qr'); box.innerHTML='';
  try{
    new QRCode(box, { text: joinLink(), width:150, height:150, colorDark:'#191b1f', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
  }catch(e){
    box.innerHTML = '<p class="note">QR ?</p>';
  }
}
function copyCode(){ copyText(group.code, t('codeCopied')); }
function copyLink(){ copyText(joinLink(), t('linkCopied')); }
function copyText(txt, msg){
  navigator.clipboard.writeText(txt).then(()=>toast(msg)).catch(()=>{
    prompt(t('copyPrompt'), txt);
  });
}

/* ---------- ui utils ---------- */
function showModal(id){
  markSegs();
  $(id).classList.add('show');
  const inp=$(id).querySelector('input'); if(inp) setTimeout(()=>inp.focus(),50);
}
function hideModals(){ document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('show')); }
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1800);
}
function fmtDate(pid){
  try{
    const dt = new Date(pid + 'T12:00:00');
    return dt.toLocaleDateString(prefs.lang==='de' ? 'de-DE' : 'en-GB',
      prefs.lang==='de' ? {day:'2-digit',month:'2-digit',year:'numeric'} : {day:'numeric',month:'short',year:'numeric'});
  }catch(e){
    const [y,m,d] = pid.split('-');
    return `${d}.${m}.${y}`;
  }
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
</script>
